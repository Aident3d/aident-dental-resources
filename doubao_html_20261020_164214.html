            {name:"East Timor",ch:"东帝汶",leader:"罗华齐",region:"东南亚"},
            {name:"Philippines",ch:"菲律宾",leader:"罗华齐",region:"东南亚"},
            {name:"India",ch:"印度",leader:"罗华齐",region:"南亚"},
        ];
        const colorMap = {
            "闭梅婷":"#ff9944",
            "陈银蕊":"#4488ee",
            "罗华齐":"#44bb77"
        };
        let currentFilter = "all";
        let searchKeyword = "";

        function renderMap(){
            let showData = rawData;
            // 负责人筛选
            if(currentFilter !== "all"){
                showData = showData.filter(d=>d.leader === currentFilter);
            }
            // 国家模糊搜索
            if(searchKeyword.trim() !== ""){
                const kw = searchKeyword.trim().toLowerCase();
                showData = showData.filter(d=>d.ch.includes(kw));
            }
            const seriesData = showData.map(item=>{
                return {
                    name: item.name,
                    value: 1,
                    leader: item.leader,
                    region: item.region,
                    cn: item.ch,
                    itemStyle:{color: colorMap[item.leader]}
                }
            })
            const option = {
                title:{text:"国家负责人分配地图",left:"center"},
                tooltip:{
                    trigger:"item",
                    formatter:params=>{
                        if(!params.data) return params.name;
                        return `【${params.data.leader}】<br>${params.data.cn}（${params.data.region}）`
                    }
                },
                visualMap:{show:false,min:0,max:1},
                series:[{
                    type:"map",
                    map:"world",
                    roam:true,
                    zoom:1.2,
                    label:{show:false},
                    emphasis:{
                        label:{show:true},
                        itemStyle:{areaColor:"#ffdd00"}
                    },
                    data:seriesData
                }]
            }
            myChart.setOption(option);
        }
        renderMap();

        // 负责人点击筛选
        document.querySelectorAll('.item').forEach(el=>{
            el.onclick = ()=>{
                document.querySelectorAll('.item').forEach(i=>i.classList.remove('active'))
                el.classList.add('active')
                currentFilter = el.dataset.val
                renderMap();
            }
        })
        // 搜索框监听
        document.getElementById('searchInput').oninput = function(){
            searchKeyword = this.value;
            renderMap();
        }
        window.addEventListener('resize',()=>myChart.resize())
